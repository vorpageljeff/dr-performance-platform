services:
  - type: web
    name: dr-performance-api
    runtime: node
    buildCommand: npm ci && npm run build:api
    startCommand: npm run start -w @dr-performance/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
